# ═══════════════ SERVER ═══════════════
server.port=${PORT:8080}

# ═══════════════ POSTGRESQL ═══════════════
# Uses env vars in production, falls back to local dev defaults
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ufitdb}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:4589}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# 'update' keeps existing data and only applies schema changes
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ═══════════════ CORS ═══════════════
# Comma-separated list of allowed frontend origins
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173}

# ═══════════════ CalorieNinjas API ═══════════════
